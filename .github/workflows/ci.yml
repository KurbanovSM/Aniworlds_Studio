name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pyright
      - run: python -m pytest --cov

  game-compatibility:
    runs-on: ubuntu-latest
    env:
      ANIWORLDS_AI_REPO_TOKEN: ${{ secrets.ANIWORLDS_AI_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Explain unavailable private-repository check
        if: env.ANIWORLDS_AI_REPO_TOKEN == ''
        run: echo "Game compatibility is checked locally until ANIWORLDS_AI_REPO_TOKEN is configured."
      - uses: actions/checkout@v4
        if: env.ANIWORLDS_AI_REPO_TOKEN != ''
        with:
          repository: KurbanovSM/Aniworlds_AI_v3
          path: .integration/Aniworlds_AI_v3
          token: ${{ env.ANIWORLDS_AI_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: env.ANIWORLDS_AI_REPO_TOKEN != ''
        with:
          python-version: "3.12"
      - if: env.ANIWORLDS_AI_REPO_TOKEN != ''
        run: python -m pip install -e ".[dev]" -e .integration/Aniworlds_AI_v3
      - if: env.ANIWORLDS_AI_REPO_TOKEN != ''
        run: python -m pytest tests/test_published_game_compatibility.py
        env:
          ANIWORLDS_AI_ROOT: ${{ github.workspace }}/.integration/Aniworlds_AI_v3
